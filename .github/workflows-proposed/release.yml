name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: verify tag matches version files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_versions.py --expect "${GITHUB_REF_NAME#v}"
          pip install -r requirements.txt
          python -m unittest discover -s tests

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build tarball and SHA256SUMS
        run: bash scripts/make-release.sh
      - name: Attach install scripts and checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist && sha256sum install.sh install.ps1 >> SHA256SUMS && cat SHA256SUMS
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY' > dist/RELEASE_NOTES.md
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}.*?(?=^## |\Z)", text, re.S | re.M)
          print(m.group(0).strip() if m else f"Loopback {version}")
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/loopback-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
      - name: Publish npm wrapper (requires NPM_TOKEN secret)
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish (tarball + checksums were still released)."
            exit 0
          fi
          npm publish --access public --provenance
